[year] BC = [year] av. BY
[year] AD = [year] ap. BY
Barbarians = Pirates
Galactic Empire = Empire Galactique
Emperor Palpatine = Empereur Palpatine
Imperial = Impérial
The Dark Side of the Force is a pathway to many abilities some consider to be unnatural. = Le Côté Obscur de la Force est un chemin vers de nombreuses capacités que certains considèrent comme... contraires à la nature.
Did you ever hear the tragedy off Darth Plagueis the Wise? = Avez-vous jamais entendu la tragédie de Dark Plagueis le Sage ?
Those who do not serve my ends, no matter how powerful they are, will be eliminated. = Ceux qui ne servent pas mes desseins, aussi puissants soient-ils, seront éliminés.
This will be the final word in the story of your civilisation ! = Ce sera le dernier mot dans l'histoire de votre civilisation !
I have died before. = Je suis déjà mort.
I am Darth Sidious. I am all the Sith ! = Je suis Dark Sidious. Je suis tous les Sith !
Everything is going as I planned now. = Tout se passe comme je l'avais prévu.
I have been every voice you have ever heard inside your head. = J'ai été toutes les voix... que tu as jamais entendues... dans ta tête.
Oh, no, my young Jedi. You will find that it is you who are mistaken, about a great many things. = Oh non, jeune Jedi. Vous constaterez que c’est vous qui êtes dans l'erreur... à bien des égards.
Your faith in your friends is yours. = Votre confiance en vos amis vous appartient.
You’re one man against a galaxy full of scoundrels. = Vous êtes seul face à une galaxie pleine de scélérats.
Are you threatening me ? = Vous me menacez ?
There is only one plan ! One great design which shall govern the universe ! Mine ! = Il n'y a qu'un seul plan ! Un seul grand dessein qui régira l'univers ! Le mien !
The Sith and the Jedi are similar in almost every way, including their quest for greater power. = Les Sith et les Jedi sont similaires à presque tous les égards, y compris dans leur quête d'un pouvoir accru.
Your feeble skills are no match for the power of the dark side. = Vos piètres talents ne font pas le poids face à la puissance du côté obscur.
And if I ever need your services again, I will not hesitate to clone you. = Et si jamais j'ai de nouveau besoin de vos services, je n'hésiterai pas à vous cloner.
New Order = Nouvel Ordre
Alderaan = Aldérande

Infinite Empire = Empire Infini
Rakatan = Rakata
The Rakata are a pestilence upon the galaxy that, to their shame, the Kwa, unleashed. = Les Rakatas sont un fléau pour la galaxie que, à leur honte, les Kwas ont déchaîné.
The Gate is mine to command! I am the Infinite Empire and the galaxy belongs to me! = La Porte est à moi ! Je suis l'Empire Infini et la galaxie m'appartient !
You were not the first to challenge me. I have crushed all who opposed me, as I have crushed you… as I will crush these obstacles to my will—the Je'daii! = Tu n'étais pas le premier à me défier. J'ai écrasé tous ceux qui s'opposaient à moi, comme je t'ai écrasé… comme j'écraserai ces obstacles à ma volonté : les Je'daii !
By definition, the Infinite Empire cannot fall. = Par définition, l'Empire Infini ne peut pas tomber.
I am Rakata—it is the name of my people. = Je suis Rakata — c'est le nom de mon peuple.
We are the victors. We do as we like with you. = Nous sommes les vainqueurs. Nous faisons de vous ce que nous voulons.
You suggest both respect and insolence toward your superior in one bold gesture, slave? You learn will. = Tu suggères à la fois le respect et l'insolence envers ton supérieur dans un seul geste audacieux, esclave ? Tu apprendras par la volonté.
The Rakata are by nature a cruel and savage species. = Les Rakatas sont par nature une espèce cruelle et sauvage.
Surely you know the glory of the Builders and our Infinite Empire. The fury of our weapons surpass even my own might. = Vous connaissez sans doute la gloire des Bâtisseurs et de notre Empire Infini. La fureur de nos armes surpasse même ma propre force.
Slave world = Monde esclave

Jedi Order = Ordre Jedi
Grand Master Yoda = Grand Maître Yoda
Size matters not. Look at me. Judge me by my size, do you? Hmm? Hmm. And well you should not. = La taille importe peu…regarde moi : est-ce par la taille que tu peux me juger ? Et bien tu ne le dois pas.
For my ally is the Force, and a powerful ally it is. Life creates it, makes it grow. Its energy surrounds us and binds us. Luminous beings are we, not this crude matter. You must feel the Force around you; here, between you, me, the tree, the rock, everywhere, yes. Even between the land and the ship. = Car mon alliée est la Force. Et c'est, des alliées, la plus puissante. La vie l'a créée, la fait grandir. Son énergie nous entoure et nous relie. Nous sommes des êtres lumineux, pas cette matière grossière. Tu dois sentir la Force autour de toi ; ici, entre toi, moi, l'arbre, la roche, partout, oui. Même entre la terre et le vaisseau.
Powerful you have become, the dark side I sense in you. = Puissant tu es devenu, le côté obscur en toi je perçois.
Fear is the path to the dark side. Fear leads to anger. Anger leads to hate. Hate leads to suffering. = La peur est le chemin vers le côté obscur. La peur mène à la colère. La colère mène à la haine. La haine mène à la souffrance.
Into exile I must go. Failed, I have. = En exil je dois partie. Échoué j'ai.
Secret, shall I tell you? Grand Master of Jedi Order am I. Won this job in a raffle I did, think you? 'How did you know, how did you know, Master Yoda?' Master Yoda knows these things. His job it is. = Un secret, te dire je vais ? Grand Maître de l'Ordre Jedi, je suis. Gagné ce poste à la tombola, j'ai, tu penses ? « Comment as-tu su, comment as-tu su, Maître Yoda ? » Maître Yoda, ces choses-là, il les sait. Son travail, c'est. 
May the force be with you. = Que la Force soit avec vous.
Do or do not. There is no try. = Fais-le ou ne le fais pas. Il n'y a pas d'essai.
Darker, the coming storm grows. I fear the dark cloud of the Sith shrouds us all. = Plus sombres se font les temps, la tempête approche. Je crains que le nuage noir des Sith ne nous enveloppe tous.
Feel the force! = Ressens la Force !
There is a disturbance in the Force. = Il y a un trouble au sein de la Force.
Once you start down the dark path, forever will it dominate your destiny. Consume you, it will. = Une fois engagé sur la voie obscure, à jamais elle dominera ton destin. Te consumer elle fera.
Control, control, you must learn control! = Contrôle, contrôle, il faut apprendre le contrôle !
Great warrior. Wars not make one great. = Grand guerrier. Les guerres ne rendent pas grand.
Your path you must decide. = Ton chemin tu dois décider.
There is no death, there is the Force = Il n'y a pa de mort, il y'a la Force

Hutt Cartel = Cartel des Hutts
Rejoice, wretched creatures. Your planet is now the property of the glorious Hutt Cartel. = Réjouissez-vous, misérables créatures ! Votre planète est désormais la propriété du glorieux cartel Hutt.
We represent our people. Their honor. Their power. We are the Hutt Council. = Nous représentons notre peuple. Son honneur. Son pouvoir. Nous sommes le Conseil Hutt.
Slave trade = Commerce d'esclaves

Xim's Empire = Empire de Xim
Xim the Despot = Xim le Despote
Tionese = Tionais
In Eternal Homage to Xim, Whose Fist Shall Enclose the Stars and Whose Name Shall Outlive Time. = En hommage éternel à Xim, dont le poing enserrera les étoiles et dont le nom survivra au temps.
This world is mine ! = Ce monde est à moi !
I'm not the only one who loathed your poetry. = Je ne suis pas le seul à avoir détesté votre poésie.
I did the galaxy a favor. = J'ai rendu service à la galaxie.
Hello, I am Xim the Despote. = Salutations, je suis Xim le Despote.
Hello. = Boujour.
What do you want ? = Que voulez-vous ?
No. = Non.
Yes. = Oui.
You recognize my superiority. = Vous reconnaissez ma supériorité.
I have an offer you can't refuse. = J'ai une offre que vous ne pouvez pas refuser.
Cronese Sweeps = Balayages Cronais
Oziaf the Insignificant = Oziaf l'Insignifiant

Mandalorians = Mandaloriens
Mandalore the Ultimate = Mandalore l'Ultime
Here's why you can't exterminate us, aruetii. We're not huddled in one place—we span the galaxy. We need no lords or leaders—so you can't destroy our command. We can live without technology—so we can fight with our bare hands. We have no species or bloodline—so we can rebuild our ranks with others who want to join us. = Voici pourquoi vous ne pouvez pas nous exterminer, aruetii. Nous ne sommes pas regroupés en un seul lieu ; nous parcourons la galaxie. Nous n'avons besoin ni de seigneurs ni de chefs ; vous ne pouvez donc pas détruire notre commandement. Nous pouvons vivre sans technologie ; nous pouvons donc combattre à mains nues. Nous n'avons ni espèce ni lignée ; nous pouvons donc reconstituer nos rangs avec ceux qui souhaitent nous rejoindre.
We're more than just a people or an army, aruetii. We're a culture. We're an idea. And you can't kill ideas—but we can certainly kill you. = Nous sommes bien plus qu'un peuple ou une armée, aruetii. Nous sommes une culture. Nous sommes une idée. Et on ne peut pas tuer les idées, mais nous, nous pouvons certainement vous tuer.
I see what you're doing. I see a defense without honor. Let them see what such a defense deserves. Let them burn. = Je vois ce que vous faites. Je vois une défense sans honneur. Qu'ils voient ce que mérite une telle défense. Qu'ils brûlent.
For my people it's the honor and glory of battle that rules us. It's through combat that we prove our worth, gain renown and make our fortunes. = Pour mon peuple, c'est l'honneur et la gloire du combat qui nous gouvernent. C'est par les armes que nous prouvons notre valeur, que nous acquérons la renommée et que nous bâtissons notre fortune.
It wasn't supposed to end like this. = Ça ne devait pas se terminer comme ça.
There is only one answer — and that answer is the word of Mandalore. = Il n'y a qu'une seule réponse — et cette réponse est la parole de Mandalore.
Politics is simply the continuation of war by other means. = La politique n'est rien d'autre que la continuation de la guerre par d'autres moyens.
I'm someone you don't want to get on the bad side of. = Je suis quelqu'un qu'il vaut mieux ne pas se mettre à dos.
A warrior knows nothing of surrender. = Un guerrier ne connaît rien de la reddition.
I think I need something more than killing and fighting in my life. = Je crois que j'ai besoin de plus que tuer et me battre dans ma vie.
Way of the Mandalore = Voie du Mandalore
Mandalorian Creed = Credo Mandalorien

Sith Order = Ordre Sith
Darth Revan = Dark Revan
Evil is a word used by the ignorant and the weak. The Dark Side is about survival. It's about unleashing your inner power. It glorifies the strength of the individual. = Le mal est un mot employé par les ignorants et les faibles. Le Côté Obscur, c'est la survie. C'est libérer sa force intérieure. C'est glorifier la force de l'individu.
Peace is a lie. There is only Passion. Through Passion, I gain Strength. Through Strength, I gain Power. Through Power, I gain Victory. Through Victory my chains are Broken. The Force shall free me. = La paix est un mensonge. Seule la passion existe. Par la passion, j'acquiers la force. Par la force, j'acquiers le pouvoir. Par le pouvoir, j'obtiens la victoire. Par la victoire, mes chaînes sont brisées. La Force me libérera.
There will be no truce. There will be no surrender. I don't care how many die. An example will be made of the deserters. = Il n'y aura pas de trêve. Il n'y aura pas de reddition. Peu m'importe le nombre de morts. Un exemple sera fait des déserteurs.
Life… death… the one is the same as the other. = La vie… la mort… l’une est la même chose que l’autre.
The galaxy writhes in chaos and disorder. It requires a man of vision. I am that man of vision. I am the new Emperor. = La galaxie est en proie au chaos et au désordre. Elle a besoin d'un visionnaire. Ce visionnaire, c'est moi. Je suis le nouvel Empereur.
True power can come only to those who embrace the transformation. = Le véritable pouvoir ne peut être acquis qu'à ceux qui embrassent la transformation.
Equality is a myth to protect the weak. some of us are strong in the Force, others are not. Only a fool believes otherwise. = L'égalité est un mythe destiné à protéger les faibles. Certains d'entre nous sont puissants dans la Force, d'autres non. Seul un insensé croit le contraire.
Through Power I gain Victory. Through Victory my chains are Broken. The Force shall free me. = Par le pouvoir, j'obtiens la victoire. Par la victoire, mes chaînes sont brisées. La Force me libérera.
Remember why the Sith are more powerful than the Jedi,because we are not afraid to feel. = N'oubliez pas pourquoi les Sith sont plus puissants que les Jedi : parce que nous n'avons pas peur de ressentir.
We take what we desire because we can. We can because we have power. We have power because we are Sith. = Nous prenons ce que nous désirons parce que nous le pouvons. Nous le pouvons parce que nous avons le pouvoir. Nous avons le pouvoir parce que nous sommes Sith.
Fear attracts the fearful…the strong…the weak…the innocent…the corrupt. Fear. Fear is my ally. = La peur attire les craintifs… les forts… les faibles… les innocents… les corrompus. La peur. La peur est mon alliée.
To understand the dark side you must suffer through hardship and struggle. = Pour comprendre le côté obscur, il faut endurer les épreuves et les luttes.
If the leader grows weak another must rise to seize the mantle. = Si le dirigeant faiblit, un autre doit prendre la relève.
I am not a man of words. But I respect the power of words, for that is what transformed me. The words of the Sith Code... = Je ne suis pas un homme de mots. Mais je respecte le pouvoir des mots, car c'est ce qui m'a transformé. Les mots du Code Sith…
The strong rule; the weak are meant to serve. This is the way it must be. = Les forts commandent ; les faibles sont là pour servir. Il en est ainsi.
Revenge of the Sith = Revanche des Sith
Darth Baras = Dark Baras
Darth Xarion = Dark Xarion
Darth Maul = Dark Maul
Darth Krayt = Dark Krayt
Darth Maladi = Dark Maladi
Darth Kruhl = Dark Kruhl

Confederacy of Independent Systems = Confédération des Systèmes Indépendants
Count Dooku = Comte Dooku
Separatist = Séparatiste
It is an honor to stand before you, for you represent the freedom and the future of our galaxy. The once-great Republic and Jedi Order have become victims of their own ambitions, and the Supreme Chancellor is no more than a pawn of corporate monopolies. = C'est un honneur pour moi de me tenir devant vous, car vous représentez la liberté et l'avenir de notre galaxie. La République et l'Ordre Jedi, jadis si puissants, sont devenus victimes de leurs propres ambitions, et le Chancelier Suprême n'est plus qu'un pion entre les mains des monopoles.
As a people you called out for change, you called out for leadership, and I humbly answered that call. = Vous avez, en tant que peuple, réclamé le changement, vous avez réclamé un leadership, et j'ai humblement répondu à cet appel.
I want only to bring peace and order to the galaxy. = Je souhaite seulement apporter la paix et l'ordre à la galaxie.
Brave of you, boy. But I would have thought you had learned your lesson. = Courageux de ta part, mon garçon. Mais j'aurais cru que tu avais retenu la leçon.
The Sith control everything, you just don't know it. = Les Sith contrôlent tout, vous l'ignorez simplement.
I am the Count Dooku of Serenno. I am a political idealist, not a murderer. = Je suis le comte Dooku de Serenno. Je suis un idéaliste politique, pas un meurtrier.
I am committed to the idea of a galaxy ruled by an enlightened leader, with laws that apply universally—not one set for the Core Worlds, another for the Outer Rim worlds. = Je suis attaché à l'idée d'une galaxie gouvernée par un dirigeant éclairé, avec des lois universellement applicables – et non pas une loi pour les Mondes du Noyau et une autre pour les mondes de la Bordure Extérieure.
What? = Quoi ?
Anger leads to hate and hate leads to power. = La colère engendre la haine et la haine engendre le pouvoir.
I sense great fear in you. You have hate. You have anger. But you don’t use them. = Je perçois une grande peur en toi. Tu éprouves de la haine. Tu érpouves de la colère. Mais tu ne les utilises pas.
I would kill you right now if I didn't have to drag your body away. = Je te tuerais sur-le-champ si je n'avais pas à traîner ton corps.
Your ideology, while faulty, does have its points. = Votre idéologie, bien que défaillante, a néanmoins ses mérites.
I don't condone your methods, but you had every right to protect your planet. = Je ne cautionne pas vos méthodes, mais vous aviez parfaitement le droit de protéger votre planète.
I am a man of great wealth, and I can be very generous to my allies. = Je suis un homme très riche et je peux me montrer très généreux envers mes alliés.
Droid Army = Armée Droïde

Alliance to Restore the Republic = Alliance pour la Restoration de la République
Rebel = Rebelle
We, the Rebel Alliance, do therefore in the name—and by the authority—of the free beings of the Galaxy, solemnly publish and declare our intentions. =Nous, l'Alliance Rebelle, publions et déclarons donc solennellement, au nom et par l'autorité des êtres libres de la Galaxie, nos intentions.
To fight and oppose you and your forces, by any and all means at our disposal; to refuse any Imperial law contrary to the rights of free beings; to bring about your destruction and the destruction of the Galactic Empire; to make forever free all beings in the galaxy. To these ends, we pledge our property, our honor, and our lives. = Nous nous engageons à vous combattre, vous et vos forces, par tous les moyens à notre disposition ; à refuser toute loi impériale contraire aux droits des êtres libres ; à provoquer votre destruction et celle de l'Empire galactique ; à libérer à jamais tous les êtres de la galaxie. À ces fins, nous engageons nos biens, notre honneur et nos vies.
We agree that the time for diplomacy and politics has passed. It is now time for action… therefore let this be an official declaration of rebellion! Today, we all vow to change the galaxy, and one day the galaxy will indeed be free! = Nous sommes d'accord : le temps de la diplomatie et de la politique est révolu. L'heure est à l'action… Que ceci soit donc une déclaration officielle de rébellion ! Aujourd'hui, nous jurons tous de changer la galaxie, et un jour, la galaxie sera enfin libre !
We have powerful friends. You’re going to regret this. = Nous avons des amis influents. Vous le regretterez.
You can kill me, but you can't kill what I stand for... and you won't stop justice. = Vous pouvez me tuer, mais vous ne pouvez pas tuer ce que je représente... et vous n'arrêterez pas la justice.
We are loyalists, trying to preserve democracy in the Republic. = Nous sommes des loyalistes, qui essayons de préserver la démocratie dans la République.
What is it? What do you need to tell us? = Qu'est-ce que c'est ? Que devez-vous nous dire ?
You're learning the most powerful lesson of all. You're learning how to fall. = Vous apprenez la leçon la plus importante de toutes. Vous apprenez à tomber.
I hope one day we can fight together. = J'espère qu'un jour nous pourrons combattre ensemble.
I feel like because I can fight, I have to, for those who cannot. And I think you might be the same way. = J'ai le sentiment que, puisque je peux me battre, je dois le faire pour ceux qui ne le peuvent pas. Et je pense que vous ressentez peut-être la même chose.
You target civilians, kill those who surrender, break every rule of engagement! = Vous prenez pour cible les civils, vous tuez ceux qui se rendent, vous enfreignez toutes les règles d'engagement !
The chancellor has made herself clear. This meeting is over. = La chancelière a été claire. Cette réunion est terminée.
You have your moments. Not many of them, but you do have them. = Vous avez vos moments. Pas beaucoup, certes, mais vous en avez.
War is not a state of being. It is meant to be a temporary chaos between periods of peace. Some want it to be the course of things, a default fact of existence. But I will not let that be so. = La guerre n'est pas un état permanent. Elle est censée être un chaos temporaire entre deux périodes de paix. Certains voudraient qu'elle devienne la norme, une fatalité. Mais je ne l'accepterai pas.
This is Mon Mothma. I have an assignment for you. The Rebellion needs you and we don't have much time. We must work together. = Ici Mon Mothma. J'ai une mission pour vous. La Rébellion a besoin de vous et le temps presse. Nous devons collaborer.
A New Hope = Un Nouvel Espoir

Yuuzhan Vong Empire = Empire Yuuzhan Vong
This is not about your little planet. We will take your whole galaxy. We will destroy your machines; they are an abomination. = Il ne s'agit pas de votre petite planète. Nous allons conquérir votre galaxie entière. Nous détruirons vos machines ; ce sont des abominations.
We will share our ways, we will share our beliefs. We will share pain, like us, you will come to embrace it. = Nous partagerons nos coutumes, nous partagerons nos convictions. Nous partagerons notre souffrance, et comme nous, vous finirez par l'accepter.
It is not your galaxy. You have merely infested it for a time. We have come to end the infection, in the name of glorious Yun-Yuuzhan. Tchurokk Yun'tchilat! = Ce n'est pas votre galaxie. Vous l'avez simplement infestée temporairement. Nous sommes venus mettre fin à l'infection, au nom du glorieux Yun-Yuuzhan. Tchurokk Yun'tchilat !
We shall teach you the glory of the gods. Do-ro'ik vong pratte! = Nous vous enseignerons la gloire des dieux. Do-ro'ik vong pratte !
Long life to Shimrra, beloved of the gods! = Longue vie à Shimrra, aimé des dieux !
You will learn the glory of the Praetorite Vong. = Vous découvrirez la gloire des Vong prétorites.
Welcome my home. You see my home, I be-bel-believe. You come me there. I show you splendor Yuuzhan Vong. = Bienvenue chez moi. Tu vois ma maison, je te crois. Viens me voir là-bas. Je te montre la splendeur des Yuuzhan Vong.

Eternal Empire = Empire Éternel
Valkorion the Immortal Emperor = Valkorion l'Empereur Immortel
Zakuulan = Zakelien
Look around you. Zakuul is poised to become the greatest civilization in the history of the galaxy. = Regardez autour de vous. Zakel est sur le point de devenir la plus grande civilisation de l'histoire de la galaxie.
I have forged this empire to surmount all of my previous works. To span eternity. = J'ai forgé cet empire pour surpasser toutes mes œuvres précédentes. Pour qu'il s'étende sur l'éternité.
I see futures in you. Futures I will not allow. Your future ends here. = Je vois en vous un avenir. Un avenir que je ne permettrai pas. Votre avenir s'arrête ici.
You presume limits to my power. There are none. = Vous présumez des limites à mon pouvoir. Il n'y en a pas.
My life spans millennia. Legions have risen to test me… My ascendance is inevitable. A day, a year, a millennium—it matters not. I hold the patience of stone and the will of stars. Your striving is insignificant. Let your death be the same. = Ma vie s'étend sur des millénaires. Des légions se sont levées pour me mettre à l'épreuve… Mon ascension est inévitable. Un jour, une année, un millénaire – peu importe. J'ai la patience de la pierre et la volonté des étoiles. Vos efforts sont vains. Que votre mort le soit aussi.
Kneel before the dragon of Zakuul. = Agenouillez-vous devant le dragon de Zakel.
Rules are for people who lack the creativity to break them. = Les règles sont faites pour ceux qui n'ont pas la créativité nécessaire pour les enfreindre.
I am the wrath of the dragon's fire. I am your Eternal Emperor. = Je suis la colère du feu du dragon. Je suis votre Empereur Éternel.
The deaths you've caused. The war you've fueled. It is all mine. This galaxy is mine. It's time I claimed it once more. = Les morts que vous avez causées. La guerre que vous avez alimentée. Tout cela m'appartient. Cette galaxie est à moi. Il est temps que je la revendique.
These petty conflicts mean nothing. The concerns of this galaxy are meaningless. Once I ascend, all will be tranquil in this galaxy. It is my promise to you. = Ces querelles mesquines sont insignifiantes. Les préoccupations de cette galaxie sont vaines. Une fois que j'aurai le pouvoir, la paix régnera dans cette galaxie. Je vous le promets.
You are mine. Servants. Slaves. Weapons. And you will obey… = Vous m'appartenez. Serviteurs. Esclaves. Armes. Et vous obéirez…
Eternal Throne = Trône Éternel
Zakuul = Zakel
