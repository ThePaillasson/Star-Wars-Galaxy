name: Generate Unciv Atlas

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate-atlas:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Download Unciv
        run: |
          unciv_url=$(curl -s https://api.github.com/repos/yairm210/Unciv/releases/latest \
            | grep -o 'http[^"]*Unciv.jar' \
            | head -1)

          echo "Downloading: $unciv_url"
          wget -q -O Unciv.jar "$unciv_url"

      - name: Generate texture atlases
        run: |
          java -jar Unciv.jar mod-ci

      - name: Remove Unciv
        run: rm -f Unciv.jar

      - name: Commit generated atlases
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add -A

          if git diff --cached --quiet; then
            echo "No atlas changes."
          else
            git commit -m "Generate Unciv texture atlas"
            git push
          fi
