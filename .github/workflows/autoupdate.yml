name: Generate Unciv Atlas

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate-atlas:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Download Unciv
        run: |
          unciv_url=$(curl -sL https://api.github.com/repos/yairm210/Unciv/releases/latest \
            | grep -o 'https://[^"]*Unciv.jar' \
            | head -1)

          echo "Downloading: $unciv_url"
          wget -q -O Unciv.jar "$unciv_url"

      - name: Delete old atlases
        run: |
          rm -f game.png game.atlas
          rm -f Tileset.png Tileset.atlas
          rm -f Constructions.png Constructions.atlas
          rm -f UnitPromotionIcons.png UnitPromotionIcons.atlas

      - name: Generate texture atlases
        run: |
          java -jar Unciv.jar mod-ci

      - name: Check generated atlases
        run: |
          echo "Checking Stormtrooper..."
          grep -q "TileSets/FantasyHex/Units/Stormtrooper" Tileset.atlas

          echo "Checking Galactic Empire..."
          grep -q "NationsIcons/Galactic Empire" game.atlas

          echo "All custom graphics found in atlases!"

      - name: Remove Unciv
        run: rm -f Unciv.jar

      - name: Commit generated atlases
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add -A

          if git diff --cached --quiet; then
            echo "No atlas changes."
          else
            git commit -m "Regenerate Unciv texture atlases"
            git push
          fi
